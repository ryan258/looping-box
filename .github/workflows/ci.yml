name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  acceptance:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.9"}  # ubuntu-latest (26.04) has no 3.9
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: ubuntu-latest, python: "3.15"}
          - {os: macos-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Record environment
        run: |
          git rev-parse HEAD
          python --version
          python -c 'import platform; print(platform.platform())'
      - name: Full offline suite (installed scenario explicitly skipped here)
        run: python -m unittest discover -s tests
      - name: Build and install wheel in an isolated environment
        shell: bash
        run: |
          package_root="$(mktemp -d)"
          python -m venv "$package_root/venv"
          "$package_root/venv/bin/python" -m pip wheel --no-deps --wheel-dir "$package_root/dist" .
          "$package_root/venv/bin/python" -m pip install --no-deps "$package_root/dist/looping_box-0.2.0-py3-none-any.whl"
          echo "LOOPING_BOX_TEST_CLI=$package_root/venv/bin/looping-box" >> "$GITHUB_ENV"
          shasum -a 256 "$package_root/dist/looping_box-0.2.0-py3-none-any.whl"
      - name: Actual installed-wheel acceptance outside checkout
        run: python -m unittest discover -s tests -p 'test_package_acceptance.py'
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check src tests
